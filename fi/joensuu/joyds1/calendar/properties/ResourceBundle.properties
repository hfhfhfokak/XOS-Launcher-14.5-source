# Default date formats SHORT, MEDIUM, LONG and FULL for calendars.
# Formats are documented in class DateFormat.
#
# First character after the equals sign is the character separating
# the formats. It must not occur in the formats and it can not
# be a letter or a digit. Letters and digits are defined as
# in function Character.isLetterOrDigit(char).

DefaultDateFormat=|d.M.y|d MMM y|d MMMM y|EEEE, d MMMM y


